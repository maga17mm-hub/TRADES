<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161922" />
      <stop offset="100%" stop-color="#0c0d12" />
    </linearGradient>
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- Grid overlay -->
  <path d="M 60 160 H 452 M 60 260 H 452 M 60 360 H 452" stroke="rgba(255, 255, 255, 0.04)" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M 160 60 V 452 M 260 60 V 452 M 360 60 V 452" stroke="rgba(255, 255, 255, 0.04)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Candle 1 (Green) -->
  <line x1="150" y1="200" x2="150" y2="370" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <rect x="130" y="240" width="40" height="90" rx="6" fill="#10b981" />

  <!-- Candle 2 (Red) -->
  <line x1="256" y1="170" x2="256" y2="340" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <rect x="236" y="210" width="40" height="75" rx="6" fill="#ef4444" />

  <!-- Candle 3 (Green Breakout) -->
  <line x1="362" y1="110" x2="362" y2="300" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <rect x="342" y="140" width="40" height="110" rx="6" fill="#10b981" />

  <!-- Neon Glowing Trend Line -->
  <path d="M 110 350 Q 180 270 256 280 T 400 130" fill="none" stroke="url(#trendGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="400" cy="130" r="9" fill="#10b981" filter="url(#glow)"/>
</svg>
